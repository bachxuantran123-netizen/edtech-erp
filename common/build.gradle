// common module — shared entities, enums, utilities
// No Spring Boot application class needed — this is a library module

plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:4.1.0"
    }
}

dependencies {
    // JPA annotations (api scope → exported to consumers)
    api 'jakarta.persistence:jakarta.persistence-api'

    // Lombok (compileOnly → IDE sees it, not bundled in jar)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}
