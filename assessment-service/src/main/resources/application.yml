spring:
  application:
    name: assessment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/${ASSESSMENT_DB_NAME:assessment_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8083
